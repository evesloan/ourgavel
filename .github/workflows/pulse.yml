name: pulse
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Poll feeds & sync community queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GB_REPO: ${{ github.repository }}
        run: node scripts/poll.js
      - name: Commit data changes
        run: |
          git config user.name "gavelboard-pulse"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "pulse: $(date -u +%FT%TZ)"
          git push
      - name: Build site
        env:
          GB_REPO: ${{ github.repository }}
        run: node scripts/build.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
