name: 🚩 Report content
description: Doxxing, accusations against private people, fabricated sourcing, harassment.
title: "[report] "
labels: ["report", "priority"]
body:
  - type: input
    id: where
    attributes:
      label: What are you reporting? (node title, issue number, or URL)
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Problem
      options: ["Accuses or identifies a private person", "Personal information / doxxing", "Fabricated or misattributed source", "Harassment or abuse", "Other"]
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: Details
    validations:
      required: true
