name: 🧵 Post a theory
description: A hypothesis about the case, for the Board. Reviewed before it appears.
title: "[theory] "
labels: ["community", "theory", "pending-review"]
body:
  - type: markdown
    attributes:
      value: |
        Theories about the case publish to the Board within about 15 minutes. Anything that discusses a specific person is looked at by an editor first (usually under an hour). We don't publish accusations against people who haven't been charged, or anyone's personal information — question conduct and institutions freely. Limit: 3 posts per day.
  - type: input
    id: case
    attributes:
      label: Case
      placeholder: lindsay-clancy
    validations:
      required: true
  - type: input
    id: claim
    attributes:
      label: Your theory, in one sentence
      placeholder: "The rebuttal experts' timing suggests…"
    validations:
      required: true
  - type: textarea
    id: reasoning
    attributes:
      label: Reasoning
      description: What in the record points this way? Reference Board nodes or trial days where you can.
    validations:
      required: true
  - type: textarea
    id: falsify
    attributes:
      label: What would disprove it?
      description: The Board's favorite question. A theory that can't be wrong can't be interesting.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Supporting link (optional)
      placeholder: https://…
